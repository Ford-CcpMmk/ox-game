services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ox_user
      POSTGRES_PASSWORD: ox_password
      POSTGRES_DB: ox_game
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ox_user -d ox_game"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
